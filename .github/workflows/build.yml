name: Build ChroLens Mimic EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        cd main
        pyinstaller --noconfirm --onedir --windowed --name "ChroLens_Mimic" --add-data "images;images" --add-data "TTF;TTF" --add-data "models;models" --add-data "data;data" --paths "." --paths "modules" --hidden-import "ttkbootstrap" --hidden-import "ttkbootstrap.constants" --hidden-import "ttkbootstrap.themes" --hidden-import "keyboard" --hidden-import "mouse" --hidden-import "mss" --hidden-import "PIL" --hidden-import "cv2" --hidden-import "numpy" --hidden-import "pystray" --hidden-import "pynput" --hidden-import "pynput.keyboard._win32" --hidden-import "pynput.mouse._win32" --hidden-import "bezier_mouse" --hidden-import "yolo_detector" --hidden-import "recorder" --hidden-import "text_script_editor" --hidden-import "lang" --hidden-import "script_io" --hidden-import "about" --hidden-import "mini" --hidden-import "pynput_hotkey" --hidden-import "window_selector" --hidden-import "version_manager" --hidden-import "version_info_dialog" --hidden-import "image_matcher" --hidden-import "ocr_trigger" --hidden-import "utils" --hidden-import "ddddocr" --hidden-import "cnocr" --hidden-import "pytesseract" --hidden-import "ultralytics" --hidden-import "onnxruntime" --hidden-import "core.scheduler" --hidden-import "core.playlist_manager" --collect-all "ttkbootstrap" --collect-all "ultralytics" --collect-all "ddddocr" --collect-all "cnocr" --collect-all "onnxruntime" --collect-submodules "pynput" --version-file "version_info.txt" ChroLens_Mimic.py

    - name: Get Version
      id: get_version
      shell: powershell
      run: |
        $content = Get-Content 'main\ChroLens_Mimic.py' -Raw
        if ($content -match 'VERSION\s*=\s*"([^"]+)"') { $ver = $Matches[1] } else { $ver = 'Unknown' }
        echo "version=$ver" >> $env:GITHUB_OUTPUT

    - name: Zip Release
      run: |
        powershell Compress-Archive -Path main/dist/ChroLens_Mimic -DestinationPath ChroLens_Mimic_v${{ steps.get_version.outputs.version }}.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ChroLens_Mimic_Windows
        path: ChroLens_Mimic_v${{ steps.get_version.outputs.version }}.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ChroLens_Mimic_v${{ steps.get_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
